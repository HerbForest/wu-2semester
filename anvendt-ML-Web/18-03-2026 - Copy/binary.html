<!doctype html>
<html>
    <head>
        <title>TensorFlow.js linear regression</title>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
        />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    </head>
    <header>
        <div class="section no-pad-bot" id="index-banner">
            <div class="container">
                <h5 class="header center blue-text small">
                    binary classification with tensorflow.js
                </h5>
                <div class="row center">
                    <h6 class="header col s12 light">
                        Train a model to predict house price from living space.
                    </h6>
                </div>
            </div>
        </div>
    </header>
    <body>
        <div class="section no-pad-bot light-blue lighten-4">
            <div class="container">
                <div class="row center">
                    <button
                        id="toggle-button"
                        class="waves-effect waves-light light-blue btn-small"
                        onclick="toggleVisor()"
                    >
                        Toggle Visor
                    </button>
                    <br /><br />
                </div>
            </div>
        </div>
        <div class="container">
            <div class="section">
                <div class="row">
                    <div class="col s12 m6">
                        <div class="icon-block">
                            <h3 class="center light-blue-text">
                                <i class="material-icons" style="font-size: 2em">build</i>
                            </h3>
                            <h5 class="center">Train & Test</h5>
                            <p class="light"></p>
                            <div>
                                <p><label>Training status:</label></p>
                                <pre
                                    class="grey lighten-4"
                                    style="overflow-x: auto"
                                ><em id="model-status">Loading data...</em></pre>
                                <p><label>Testing status:</label></p>
                                <pre
                                    class="grey lighten-4"
                                    style="overflow-x: auto"
                                ><em id="testing-status">Not yet tested</em></pre>
                                <button
                                    autocomplete="off"
                                    id="train-button"
                                    class="waves-effect light-blue waves-light btn"
                                    disabled
                                    onclick="train()"
                                >
                                    Train New Model
                                </button>
                                <button
                                    autocomplete="off"
                                    id="test-button"
                                    class="waves-effect light-blue waves-light btn"
                                    disabled
                                    onclick="test()"
                                >
                                    Test Model
                                </button>
                            </div>
                            <br />
                            <div>
                                <button
                                    autocomplete="off"
                                    id="load-button"
                                    class="waves-effect light-blue waves-light btn-small"
                                    disabled
                                    onclick="load()"
                                >
                                    Load Model
                                </button>
                                <button
                                    autocomplete="off"
                                    id="save-button"
                                    class="waves-effect light-blue waves-light btn-small"
                                    disabled
                                    onclick="save()"
                                >
                                    Save Model
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ✅ NY PREDICT SEKTION -->
                    <div class="col s12 m6">
                        <div class="icon-block">
                            <h3 class="center light-green-text">
                                <i class="material-icons" style="font-size: 2em">timeline</i>
                            </h3>
                            <h5 class="center">Predict</h5>
                            <label
                                >Square Feet:
                                <input type="number" id="prediction-input-1" placeholder="2000"
                            /></label>
                            <label
                                >House Price ($):
                                <input type="number" id="prediction-input-2" placeholder="1000000"
                            /></label>
                            <button
                                autocomplete="off"
                                id="predict-button"
                                class="waves-effect light-green waves-light btn"
                                disabled
                                onclick="predict()"
                            >
                                Predict class
                            </button>
                            <p><strong id="prediction-output"></strong></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            let model;
            let normalisedFeature;
            let normalisedLabel;
            let trainingFeatureTensor;
            let testingFeatureTensor;
            let trainingLabelTensor;
            let testingLabelTensor;
            let points;

            async function plot(pointsArray, featureName, predictedPointsArray = null) {
                const values = [pointsArray];
                const series = ["original"];
                if (Array.isArray(predictedPointsArray)) {
                    values.push(predictedPointsArray);
                    series.push("predicted");
                }
                tfvis.render.scatterplot(
                    { name: `${featureName} vs House Price` },
                    { values, series },
                    { xLabel: featureName, yLabel: "Price" },
                );
            }

            async function plotPredictionLine() {
                const [xs, ys] = tf.tidy(() => {
                    const normalisedXs = tf.linspace(0, 1, 100);
                    const normalisedYs = model.predict(normalisedXs.reshape([100, 1]));
                    const xs = denormalise(
                        normalisedXs,
                        normalisedFeature.min,
                        normalisedFeature.max,
                    );
                    const ys = denormalise(normalisedYs, normalisedLabel.min, normalisedLabel.max);
                    return [xs.dataSync(), ys.dataSync()];
                });
                const predictedPoints = Array.from(xs).map((val, i) => {
                    return { x: val, y: ys[i] };
                });
                await plot(points, "Square feet", predictedPoints);
            }

            async function plotClasses(
                pointsArray,
                classKey,
                size = 400,
                equalizeClassSizes = false,
            ) {
                const allSeries = {};
                pointsArray.forEach((point) => {
                    const seriesName = `${classKey}: ${point.class}`;
                    let series = allSeries[seriesName];
                    if (!series) {
                        series = [];
                        allSeries[seriesName] = series;
                    }
                    series.push(point);
                });

                if (equalizeClassSizes) {
                    // ✅ Rettet: object → Object, lenght → length
                    let maxLength = null;
                    Object.values(allSeries).forEach((series) => {
                        if (
                            maxLength === null ||
                            (series.length < maxLength && series.length >= 100)
                        ) {
                            maxLength = series.length;
                        }
                    });
                    Object.keys(allSeries).forEach((keyName) => {
                        allSeries[keyName] = allSeries[keyName].slice(0, maxLength);
                        if (allSeries[keyName].length < 100) {
                            delete allSeries[keyName];
                        }
                    });
                }

                tfvis.render.scatterplot(
                    {
                        // ✅ Rettet stavefejl: "suare" → "square"
                        name: `square feet vs House Price`,
                        styles: { width: `100%` },
                    },
                    {
                        values: Object.values(allSeries),
                        series: Object.keys(allSeries),
                    },
                    {
                        xLabel: "square feet",
                        yLabel: "price",
                        height: size,
                        width: size * 1.5,
                    },
                );
            }

            async function plotParams(weight, bias) {
                // ✅ Rettet: tilføjet bias som parameter i stedet for udefineret variabel
                model.getLayer(null, 0).setWeights([tf.tensor2d([[weight]]), tf.tensor1d([bias])]);
                await plotPredictionHeatmap();
                const layer = model.getLayer(undefined, 0);
                tfvis.show.layer({ name: `layer 1` }, layer);
            }

            function normalise(tensor, previousMin = null, previousMax = null) {
                // ✅ Rettet: lenght → length, featureDimensons → featureDimensions
                const featureDimensions = tensor.shape.length > 1 && tensor.shape[1];
                if (featureDimensions && featureDimensions > 1) {
                    const features = tf.split(tensor, featureDimensions, 1);
                    const normalisedFeatures = features.map((featureTensor, i) =>
                        normalise(
                            featureTensor,
                            previousMin ? previousMin[i] : null,
                            previousMax ? previousMax[i] : null,
                        ),
                    );
                    const returnTensor = tf.concat(
                        normalisedFeatures.map((f) => f.tensor),
                        1,
                    );
                    const min = normalisedFeatures.map((f) => f.min);
                    const max = normalisedFeatures.map((f) => f.max);
                    return { tensor: returnTensor, min, max };
                } else {
                    // ✅ Rettet: tilføjet manglende else-blok med korrekte krøllede parenteser
                    const min = previousMin || tensor.min();
                    const max = previousMax || tensor.max();
                    const normalisedTensor = tensor.sub(min).div(max.sub(min));
                    return { tensor: normalisedTensor, min, max };
                }
            }

            function denormalise(tensor, min, max) {
                // ✅ Rettet: = → && (assignment i stedet for sammenligning)
                const featureDimensions = tensor.shape.length > 1 && tensor.shape[1];
                if (featureDimensions && featureDimensions > 1) {
                    const features = tf.split(tensor, featureDimensions, 1);
                    const denormalisedFeatures = features.map((featureTensor, i) =>
                        denormalise(featureTensor, min[i], max[i]),
                    );
                    const returnTensor = tf.concat(denormalisedFeatures, 1);
                    return returnTensor;
                } else {
                    // ✅ Rettet: manglende else-blok og ekstra afsluttende }
                    const denormalisedTensor = tensor.mul(max.sub(min)).add(min);
                    return denormalisedTensor;
                }
            }

            function createModel() {
                const model = tf.sequential();
                model.add(
                    tf.layers.dense({
                        inputDim: 2,
                        units: 10,
                        activation: "sigmoid",
                        useBias: true,
                    }),
                );
                model.add(
                    tf.layers.dense({
                        units: 10,
                        activation: "sigmoid",
                        useBias: true,
                    }),
                );
                model.add(
                    tf.layers.dense({
                        units: 1,
                        activation: "sigmoid",
                        useBias: true,
                    }),
                );
                const optimizer = tf.train.adam();
                model.compile({
                    optimizer,
                    loss: "binaryCrossentropy",
                    metrics: ["accuracy"],
                });
                return model;
            }

            async function trainModel(model, trainingFeatureTensor, trainingLabelTensor) {
                const { onEpochEnd } = tfvis.show.fitCallbacks({ name: "Training Performance" }, [
                    "loss",
                ]);
                return model.fit(trainingFeatureTensor, trainingLabelTensor, {
                    epochs: 200,
                    shuffle: true,
                    callbacks: {
                        onEpochEnd,
                        onEpochBegin: async function () {
                            await plotPredictionHeatmap();
                            tfvis.show.layer({ name: `Layer 1` }, model.getLayer(undefined, 0));
                        },
                    },
                });
            }

            function testModel(model, testingFeatureTensor, testingLabelTensor) {
                const lossTensor = model.evaluate(testingFeatureTensor, testingLabelTensor);
                const loss = lossTensor.dataSync();
                console.log(`Testing Loss: ${loss}`);
            }

            async function run() {
                tfvis.visor().open();
                const houseSalesDataset = tf.data.csv("kc_house_data.csv");
                const pointsDataset = houseSalesDataset.map((record) => ({
                    x: record.sqft_living,
                    y: record.price,
                    // ✅ Rettet: duplicate class-key fjernet, beholder waterfront
                    class: record.waterfront,
                }));
                points = await pointsDataset.toArray();
                if (points.length % 2 !== 0) {
                    points.pop();
                }
                tf.util.shuffle(points);
                await plotClasses(points, "waterfront");

                const featureValues = points.map((p) => [p.x, p.y]);
                const featureTensor = tf.tensor2d(featureValues);
                const labelValues = points.map((p) => p.class);
                const labelTensor = tf.tensor2d(labelValues, [labelValues.length, 1]);

                normalisedFeature = normalise(featureTensor);
                normalisedLabel = normalise(labelTensor);
                [trainingFeatureTensor, testingFeatureTensor] = tf.split(
                    normalisedFeature.tensor,
                    2,
                );
                [trainingLabelTensor, testingLabelTensor] = tf.split(normalisedLabel.tensor, 2);

                document.getElementById("model-status").innerHTML = "Data loaded";
                document.getElementById("train-button").disabled = false;
                document.getElementById("load-button").disabled = false;
            }

            async function plotPredictionHeatmap(name = "Predicted class", size = 400) {
                const [valuesPromise, xTicksPromise, yTicksPromise] = tf.tidy(() => {
                    const gridSize = 50;
                    const predictionColumns = [];
                    for (let colIndex = 0; colIndex < gridSize; colIndex++) {
                        const colInputs = [];
                        const x = colIndex / gridSize;
                        for (let rowIndex = 0; rowIndex < gridSize; rowIndex++) {
                            const y = (gridSize - rowIndex) / gridSize;
                            colInputs.push([x, y]);
                        }
                        const colPredictions = model.predict(tf.tensor2d(colInputs));
                        predictionColumns.push(colPredictions);
                    }
                    const valuesTensor = tf.stack(predictionColumns);
                    const normalisedLabelsTensor = tf.linspace(0, 1, gridSize);
                    const xTicksTensor = denormalise(
                        normalisedLabelsTensor,
                        normalisedFeature.min[0],
                        normalisedFeature.max[0],
                    );
                    const yTicksTensor = denormalise(
                        normalisedLabelsTensor.reverse(),
                        normalisedFeature.min[1],
                        normalisedFeature.max[1],
                    );
                    return [valuesTensor.array(), xTicksTensor.array(), yTicksTensor.array()];
                });

                const values = await valuesPromise;
                const xTicks = await xTicksPromise;
                const xTickLabels = xTicks.map((l) => (l / 1000).toFixed(1) + "k sqft");
                const yTicks = await yTicksPromise;
                const yTickLabels = yTicks.map((l) => "$" + (l / 1000).toFixed(0) + "k");
                const data = { values, xTickLabels, yTickLabels };

                tfvis.render.heatmap({ name: `${name} (local)`, tab: "Predictions" }, data, {
                    height: size,
                });
                tfvis.render.heatmap({ name: `${name} (full domain)`, tab: "Predictions" }, data, {
                    height: size,
                    domain: [0, 1],
                });
            }

            async function predict() {
                const predictionInputOne = parseInt(
                    document.getElementById("prediction-input-1").value,
                );
                const predictionInputTwo = parseInt(
                    document.getElementById("prediction-input-2").value,
                );
                if (isNaN(predictionInputOne)) {
                    alert("Please enter a valid number");
                } else if (isNaN(predictionInputTwo)) {
                    alert("Please enter a valid number");
                } else {
                    tf.tidy(() => {
                        const inputTensor = tf.tensor2d([[predictionInputOne, predictionInputTwo]]);
                        const normalisedInput = normalise(
                            inputTensor,
                            normalisedFeature.min,
                            normalisedFeature.max,
                        );
                        const normalisedOutputTensor = model.predict(normalisedInput.tensor);
                        const outputTensor = denormalise(
                            normalisedOutputTensor,
                            normalisedLabel.min,
                            normalisedLabel.max,
                        );
                        const outputValue = outputTensor.dataSync()[0];
                        document.getElementById("prediction-output").innerHTML =
                            `The likelihood of being a waterfront property is: ${(outputValue * 100).toFixed(1)}%`;
                    });
                }
            }

            async function load() {
                const loadedModel = await tf.loadLayersModel("localstorage://my-model");
                const optimizer = tf.train.adam();
                // ✅ Rettet: sgd → adam og meanSquaredError → binaryCrossentropy (matcher modellen)
                loadedModel.compile({
                    optimizer,
                    loss: "binaryCrossentropy",
                    metrics: ["accuracy"],
                });
                model = loadedModel;
                await plotPredictionHeatmap();
                document.getElementById("model-status").innerHTML =
                    "Model loaded from local storage";
                document.getElementById("predict-button").disabled = false;
                document.getElementById("test-button").disabled = false;
            }

            async function save() {
                const saveResult = await model.save("localstorage://my-model");
                document.getElementById("model-status").innerHTML =
                    `Model saved on ${new Date().toLocaleString()}`;
            }

            async function test() {
                const lossTensor = model.evaluate(testingFeatureTensor, testingLabelTensor);
                const loss = lossTensor.dataSync();
                document.getElementById("testing-status").innerHTML = `Testing loss: ${loss}`;
            }

            async function train() {
                document.getElementById("train-button").disabled = true;
                document.getElementById("model-status").innerHTML = "Training...";
                model = createModel();
                tfvis.show.modelSummary({ name: "Model Summary", tab: "Model" }, model);
                tfvis.show.layer(
                    { name: "Layer 1", tab: "Model Inspection" },
                    model.getLayer(undefined, 0),
                );
                await trainModel(model, trainingFeatureTensor, trainingLabelTensor);
                await plotPredictionHeatmap();
                document.getElementById("model-status").innerHTML = "Training complete";
                document.getElementById("test-button").disabled = false;
                document.getElementById("save-button").disabled = false;
                document.getElementById("predict-button").disabled = false;
                document.getElementById("train-button").disabled = false;
            }

            function toggleVisor() {
                tfvis.visor().toggle();
            }

            run();
        </script>
    </body>
</html>
